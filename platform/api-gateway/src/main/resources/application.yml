server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/transfers/**
# Bước tiếp theo: thêm spring-boot-starter-oauth2-resource-server + Keycloak để xác thực JWT tại gateway,
# và RequestRateLimiter (Redis) để giới hạn tần suất gọi API chuyển tiền.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
